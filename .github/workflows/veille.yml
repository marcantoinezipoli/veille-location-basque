name: Veille location quotidienne

on:
  schedule:
    - cron: "30 5 * * *"     # 05h30 UTC = 07h30 Paris en été, 06h30 en hiver
  workflow_dispatch:         # permet un lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python veille.py

      - name: Enregistrer l'état et le rapport
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add etat.json docs/index.html
          git commit -m "Veille du $(date -u +%Y-%m-%d)" || echo "Rien à enregistrer"
          git push
