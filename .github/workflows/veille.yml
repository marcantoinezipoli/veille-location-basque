name: Veille location quotidienne

on:
  schedule:
    - cron: "30 5 * * *"     # 07h30 Paris (été) / 06h30 (hiver) — digest du matin, toujours envoyé
    - cron: "0 11 * * *"     # 13h00 / 12h00 — e-mail seulement s'il y a du nouveau
    - cron: "30 16 * * *"    # 18h30 / 17h30 — idem
  workflow_dispatch:         # permet un lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python veille.py --mail
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Enregistrer l'état et le rapport
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add etat.json docs/index.html
          git commit -m "Veille du $(date -u +%Y-%m-%d)" || echo "Rien à enregistrer"
          git push
